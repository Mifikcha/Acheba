name: Deploy Quartz site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          ref: v5
          path: _quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _quartz/package-lock.json

      - name: Install dependencies
        working-directory: _quartz
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public content
        run: |
          rm -rf _quartz/content
          cp -R "Публичный сайт" _quartz/content

      - name: Build
        working-directory: _quartz
        run: npm run quartz -- build

      - name: Remove custom domain marker
        run: |
          rm -f _quartz/public/CNAME
          touch _quartz/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
