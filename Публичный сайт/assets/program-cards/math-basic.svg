    <path d="M112 18 C126 65 144 112 174 112 C204 112 222 65 236 18" stroke-width="3"/>
    <g fill="#000" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
      <text x="282" y="82" font-size="14">x</text>
      <text x="103" y="30" font-size="14">y</text>
      <text x="234" y="37" font-size="15">y = x<tspan font-size="10" dy="-5">2</tspan></text>
