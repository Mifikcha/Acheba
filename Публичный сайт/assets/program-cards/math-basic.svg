<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140"
     fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Parabola</title>
  <defs>
    <radialGradient id="vg" cx="50%" cy="52%" r="85%">
      <stop offset="0.60" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="0.46" y2="0.56">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff"/>
