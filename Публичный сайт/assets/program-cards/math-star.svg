    <g transform="translate(174 76)" stroke-width="2.1">
      <ellipse rx="112" ry="33"/>
      <ellipse rx="108" ry="34" transform="rotate(15)" opacity="0.96"/>
      <ellipse rx="103" ry="35" transform="rotate(30)" opacity="0.92"/>
      <ellipse rx="98" ry="36" transform="rotate(45)" opacity="0.88"/>
      <ellipse rx="93" ry="37" transform="rotate(60)" opacity="0.84"/>
      <ellipse rx="88" ry="38" transform="rotate(75)" opacity="0.8"/>
      <ellipse rx="84" ry="39" transform="rotate(90)" opacity="0.76"/>
      <ellipse rx="80" ry="40" transform="rotate(105)" opacity="0.72"/>
      <ellipse rx="76" ry="41" transform="rotate(120)" opacity="0.68"/>
      <ellipse rx="72" ry="42" transform="rotate(135)" opacity="0.64"/>
      <ellipse rx="68" ry="43" transform="rotate(150)" opacity="0.6"/>
      <ellipse rx="64" ry="44" transform="rotate(165)" opacity="0.56"/>
